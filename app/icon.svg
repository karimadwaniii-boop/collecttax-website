<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19e619"/>
      <stop offset="100%" stop-color="#0fa80f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#080808" stroke="#19e619" stroke-width="2"/>
  <!-- Card Slab Silhouette -->
  <rect x="14" y="10" width="36" height="44" rx="6" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/>
  <rect x="20" y="14" width="24" height="8" rx="2" fill="#0a0a0a" stroke="#19e619" stroke-width="1"/>
  <!-- C & T monogram stylized -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#19e619" text-anchor="middle" filter="url(#glow)">CT</text>
  <circle cx="48" cy="12" r="3" fill="#19e619"/>
</svg>
